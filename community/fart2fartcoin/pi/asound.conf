# Shared capture so Fart Finder and the OpenHome agent can both read the mic.
# Adjust "hw:1,0" to the card/device from `arecord -l`.
pcm.fartfinder_dsnoop {
    type dsnoop
    ipc_key 5978293
    slave {
        pcm "hw:1,0"
        channels 1
        rate 16000
        format S16_LE
        period_size 320
        buffer_size 3200
    }
}
pcm.fartfinder {
    type plug
    slave.pcm "fartfinder_dsnoop"
}
